<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VisionStrike</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="scanlines"></div>

    <div id="overlay">
      <h1>VISION<span>STRIKE</span></h1>
      <p class="tag">// SCHOOL AUDITORIUM OUTBREAK //</p>
      <ul>
        <li><b>Index finger</b> &mdash; aim the reticle</li>
        <li><b>Pinch</b> thumb + index &mdash; fire</li>
        <li><b>Headshots</b> deal double damage</li>
        <li>Desks &amp; pillars block shots &mdash; wait for a clear line</li>
        <li>Mouse fallback: move = aim, click/Space = fire, <b>R</b> = reload</li>
      </ul>
      <div class="buttons">
        <button id="btn-hand">START &mdash; HAND TRACKING</button>
        <button id="btn-mouse" class="alt">PLAY WITH MOUSE</button>
      </div>
      <p id="status"></p>
    </div>

    <video id="cam" playsinline muted></video>
  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
